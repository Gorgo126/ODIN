services:
  caddy:
    image: caddy:2.11.4-alpine
    container_name: caddy
    ports:
      - "${HTTP_PORT}:80"
    environment:
      # Captive portal of the Wi-Fi access point, written in .env by install.sh when POINT_ACCES=1.
      # Defaults match nobody: 192.0.2.0/32 is a documentation range (RFC 5737)
      - PORTAIL_RESEAU=${PORTAIL_RESEAU:-192.0.2.0/32}
      - PORTAIL_HOTES=${PORTAIL_HOTES:-portail.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR}/cartes:/srv/cartes:ro
      - ${DATA_DIR}/livres:/srv/livres:ro
      - ${DATA_DIR}/documents:/srv/documents:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - kiwix
      - dashboard
      - filebrowser

  dashboard:
    image: ghcr.io/gorgo126/odin-dashboard:dd270422c9647006daf40bea622864f411d299b0
    container_name: dashboard
    environment:
      - HTTP_PORT=${HTTP_PORT}
      # World link probe: TCP 443 targets and a domain to resolve (defaults kept for older .env files)
      - LIAISON_CIBLES=${LIAISON_CIBLES:-1.1.1.1,9.9.9.9,8.8.8.8}
      - LIAISON_DNS=${LIAISON_DNS:-wikipedia.org}
      # Advanced search: vectors by the « vecteurs » service (internal network only). The language
      # model (Ollama) only comes with the AI option, from compose.ia.yml.
      - VECTEURS_URL=http://vecteurs:8080
      - MODELE_EMBEDDING=${MODELE_EMBEDDING:-embeddinggemma:300m}
      - ASSISTANT_DIMENSIONS=${ASSISTANT_DIMENSIONS:-0}
      # Books not yet cleared for publication (catalogue/livres.json « publie »: false): set by
      # install.sh outside the main branch only
      - LIVRES_NON_PUBLIES=${LIVRES_NON_PUBLIES:-}
      # Offline translation (service « libretranslate », internal network): same limit as LT_CHAR_LIMIT
      - TRADUCTION_URL=http://libretranslate:5000
      - TRADUCTION_LIMITE=${TRADUCTION_LIMITE:-5000}
      # Server health (/sante): containers read through the filtered socket proxy, internal network only
      - DOCKER_URL=http://socket-proxy:2375
      # Captive portal: only devices of this range may be released (/api/portail/liberer)
      - PORTAIL_RESEAU=${PORTAIL_RESEAU:-192.0.2.0/32}
    networks:
      - default
      - traduction
      - sante
    volumes:
      - ${DATA_DIR}/zim:/data
      - ${DATA_DIR}/config:/config
      - ${DATA_DIR}/cartes:/cartes
      - ${DATA_DIR}/livres:/livres
      - ./catalogue:/catalogue:ro
      - ${DATA_DIR}/documents:/documents:ro
      - ${DATA_DIR}/assistant:/assistant
      # Translation models: written here (language packs), read-only for libretranslate
      - ${DATA_DIR}/traduction:/traduction
    restart: unless-stopped

  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:3.8.2
    container_name: kiwix
    command: ["--urlRootLocation=/kiwix", "--monitorLibrary", "--skipInvalid", "--library", "/data/library.xml"]
    volumes:
      - ${DATA_DIR}/zim:/data
    restart: unless-stopped

  filebrowser:
    image: gtstef/filebrowser:1.5.6-stable
    container_name: filebrowser
    environment:
      - FILEBROWSER_CONFIG=/home/filebrowser/config.yaml
    volumes:
      - ./config/filebrowser.yaml:/home/filebrowser/config.yaml:ro
      - ${DATA_DIR}/filebrowser:/home/filebrowser/data
      - ${DATA_DIR}/documents:/srv
    restart: unless-stopped

  vecteurs:
    # Vectors of the advanced search: EmbeddingGemma on the CPU, served by llama.cpp. The model file is
    # downloaded and checked by install.sh; the server only reads it from disk and never goes online.
    # Internal network only, no published port. Explicit port: the default will change upstream.
    # All the cores, counted at start (llama.cpp alone takes half: 2.9 s per question instead of 2.0).
    image: ghcr.io/ggml-org/llama.cpp:server-v0.4.1
    container_name: vecteurs
    entrypoint: ["sh", "-c", "exec /app/llama-server -t $$(nproc) \"$$@\"", "llama-server"]
    command: ["-m", "/modeles/${MODELE_VECTEURS:-embeddinggemma-300M-Q8_0.gguf}", "--embeddings", "--pooling", "mean",
              "-c", "4096", "-np", "2", "-b", "2048", "-ub", "2048", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - ${DATA_DIR}/vecteurs:/modeles:ro
    restart: unless-stopped

  libretranslate:
    # Offline translation (Argos models on the CPU). Its network is internal: it can never reach internet,
    # only the dashboard reaches it. Models are downloaded, checked and unpacked by the dashboard
    # (language packs, catalogue/traduction.json) and mounted read-only here: nothing can be fetched at
    # start or first use. The languages served are the models on disk; LT_LOAD_ONLY would only limit a
    # download, disabled here (and impossible on this network).
    image: libretranslate/libretranslate:v1.9.6
    container_name: libretranslate
    # Entry point of the image, plus the watch of .recharger (written by the dashboard after a language
    # was added or removed): the server process (gunicorn worker) is stopped gracefully, the gunicorn
    # master starts a new one at once, which reads the models again; the port stays open, a request
    # waits during that start. Never HUP: the gunicorn_conf.py of the image rewrites sys.argv at start,
    # and on HUP gunicorn loses its application (« No application module specified ») and stops.
    # docker stop: SIGTERM forwarded to gunicorn at once. gunicorn gone: the loop ends with it, the
    # container stops and restart: unless-stopped restarts it. Processes found in /proc (no pid file,
    # which would outlive a killed master).
    entrypoint:
      - bash
      - -c
      - |
        S=/home/libretranslate/.local/share/argos-translate/.recharger
        lu() { cat "$$S" 2>/dev/null; }
        # gunicorn processes whose parent is $$1: the master (child of the entry point), its workers
        enfants() {
          local d pp
          for d in /proc/[0-9]*; do
            read -r _ _ _ pp _ < "$$d/stat" 2>/dev/null || continue
            [ "$$pp" = "$$1" ] && grep -qa gunicorn "$$d/cmdline" 2>/dev/null && echo "$${d#/proc/}"
          done
        }
        maitre() { local m; m=$$(enfants "$$E" | head -1); [ -n "$$m" ] && echo "$$m"; }
        vu=$$(lu)
        ./scripts/entrypoint.sh & E=$$!
        arret() { local m; if m=$$(maitre); then kill -TERM "$$m"; else kill -TERM "$$E"; fi 2>/dev/null; }
        trap arret TERM INT
        while kill -0 "$$E" 2>/dev/null; do
          sleep 2 & wait $$!
          n=$$(lu)
          if [ "$$n" != "$$vu" ] && m=$$(maitre); then
            vu=$$n
            w=$$(enfants "$$m")
            [ -n "$$w" ] && kill -TERM $$w && echo "ODIN : modèles modifiés, nouveau processus serveur"
          fi
        done
        wait "$$E"
    environment:
      - LT_LOAD_ONLY=fr,en
      - LT_CHAR_LIMIT=${TRADUCTION_LIMITE:-5000}
      - LT_DISABLE_WEB_UI=true
      - LT_DISABLE_FILES_TRANSLATION=true
      - LT_API_KEYS=false
      - LT_UPDATE_MODELS=false
      - LT_FORCE_UPDATE_MODELS=false
      # One server process: each one loads its own copy of the models
      - LT_THREADS=1
    volumes:
      - ${DATA_DIR}/traduction:/home/libretranslate/.local/share/argos-translate:ro
    networks:
      - traduction
    # The image has no curl: Python, as the server itself
    healthcheck:
      test: ["CMD", "/app/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/languages', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    restart: unless-stopped

  socket-proxy:
    # Read-only window on Docker for the /sante page: the dashboard never gets the Docker socket. Only
    # GET /containers/json (list, state, health, image) and GET /info pass; everything else, including
    # the inspection of a container (its environment variables) and its logs, is refused (403). Only
    # the host name « dashboard » may connect. Internal network, no published port, not in Caddy.
    # The :ro mount does not stop requests on the socket: the allowlist does. Root without any
    # capability: the socket belongs to root, and the docker group has no fixed number across hosts.
    image: wollomatic/socket-proxy:1.13.1@sha256:3935b709275e4ec35d6ed5a5c4a1f0d01ed31eec5e7234efc3357ecd47689002
    container_name: socket-proxy
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    command:
      - -listenip=0.0.0.0
      - -allowfrom=dashboard
      - -allowGET=(/v1\.[0-9]+)?/(containers/json|info)
      - -allowhealthcheck
      - -watchdoginterval=600
      - -stoponwatchdog
      - -shutdowngracetime=5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - sante
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  # No route to internet (internal): LibreTranslate and the dashboard only
  traduction:
    internal: true
  # No route to internet (internal): the socket proxy and the dashboard only
  sante:
    internal: true

volumes:
  caddy_data:
  caddy_config:
