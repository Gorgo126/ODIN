services:
  caddy:
    image: caddy:2.11.4-alpine
    container_name: caddy
    ports:
      - "${HTTP_PORT}:80"
      - "${IA_PORT}:8081"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR}/cartes:/srv/cartes:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - kiwix
      - dashboard
      - ia
      - filebrowser

  dashboard:
    image: ghcr.io/gorgo126/odin-dashboard:03263246499847d51bae10d435821795737d2b8d
    container_name: dashboard
    environment:
      - HTTP_PORT=${HTTP_PORT}
    volumes:
      - ${DATA_DIR}/zim:/data
      - ${DATA_DIR}/config:/config
      - ${DATA_DIR}/cartes:/cartes
      - ./catalogue:/catalogue:ro
    restart: unless-stopped

  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:3.8.2
    container_name: kiwix
    command: ["--urlRootLocation=/kiwix", "--monitorLibrary", "--skipInvalid", "--library", "/data/library.xml"]
    volumes:
      - ${DATA_DIR}/zim:/data
    restart: unless-stopped

  filebrowser:
    image: gtstef/filebrowser:1.5.6-stable
    container_name: filebrowser
    environment:
      - FILEBROWSER_CONFIG=/home/filebrowser/config.yaml
    volumes:
      - ./config/filebrowser.yaml:/home/filebrowser/config.yaml:ro
      - ${DATA_DIR}/filebrowser:/home/filebrowser/data
      - ${DATA_DIR}/documents:/srv
    restart: unless-stopped

  synchro:
    image: node:20.20.2-alpine3.23
    container_name: synchro
    command: ["node", "/app/synchro.mjs"]
    environment:
      - OPENWEBUI_URL=http://ia:8080
      - COLLECTION=Mes documents
      - INTERVALLE=60
    volumes:
      - ./synchro:/app:ro
      - ${DATA_DIR}/documents:/documents:ro
      - ${DATA_DIR}/synchro:/state
    depends_on:
      ia:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.34.2
    container_name: ollama
    environment:
      # No calls to ollama.com (model recommendations, cloud cache); model pulls still work
      - OLLAMA_NO_CLOUD=true
    volumes:
      - ${DATA_DIR}/ollama:/root/.ollama
    restart: unless-stopped

  ia:
    image: ghcr.io/open-webui/open-webui:git-0a7c158
    container_name: ia
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=false
      - ENABLE_OPENAI_API=false
      - HF_HUB_OFFLINE=1
      - OFFLINE_MODE=true
      - ENABLE_CODE_EXECUTION=false
      - ENABLE_CODE_INTERPRETER=false
      - WEBUI_URL=/ia
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=bge-m3
      - RAG_OLLAMA_BASE_URL=http://ollama:11434
      - DEFAULT_MODELS=qwen2.5:3b
    volumes:
      - ${DATA_DIR}/openwebui:/app/backend/data
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
