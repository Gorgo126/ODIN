services:
  caddy:
    image: caddy:2.11.4-alpine
    container_name: caddy
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR}/cartes:/srv/cartes:ro
      - ${DATA_DIR}/livres:/srv/livres:ro
      - ${DATA_DIR}/documents:/srv/documents:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - kiwix
      - dashboard
      - filebrowser

  dashboard:
    image: ghcr.io/gorgo126/odin-dashboard:c9468a124d48b3320d554db6e09a7344cc54ad29
    container_name: dashboard
    environment:
      - HTTP_PORT=${HTTP_PORT}
      # World link probe: TCP 443 targets and a domain to resolve (defaults kept for older .env files)
      - LIAISON_CIBLES=${LIAISON_CIBLES:-1.1.1.1,9.9.9.9,8.8.8.8}
      - LIAISON_DNS=${LIAISON_DNS:-wikipedia.org}
      # Document assistant: Ollama on the internal network only, embedding model pulled by install.sh
      - OLLAMA_URL=http://ollama:11434
      - MODELE_EMBEDDING=${MODELE_EMBEDDING:-embeddinggemma:300m}
      - MODELE_CHAT=${MODELE_CHAT:-qwen3:1.7b}
      - ASSISTANT_DIMENSIONS=${ASSISTANT_DIMENSIONS:-0}
      - OLLAMA_KEEP_ALIVE=30m
    volumes:
      - ${DATA_DIR}/zim:/data
      - ${DATA_DIR}/config:/config
      - ${DATA_DIR}/cartes:/cartes
      - ${DATA_DIR}/livres:/livres
      - ./catalogue:/catalogue:ro
      - ${DATA_DIR}/documents:/documents:ro
      - ${DATA_DIR}/assistant:/assistant
    restart: unless-stopped

  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:3.8.2
    container_name: kiwix
    command: ["--urlRootLocation=/kiwix", "--monitorLibrary", "--skipInvalid", "--library", "/data/library.xml"]
    volumes:
      - ${DATA_DIR}/zim:/data
    restart: unless-stopped

  filebrowser:
    image: gtstef/filebrowser:1.5.6-stable
    container_name: filebrowser
    environment:
      - FILEBROWSER_CONFIG=/home/filebrowser/config.yaml
    volumes:
      - ./config/filebrowser.yaml:/home/filebrowser/config.yaml:ro
      - ${DATA_DIR}/filebrowser:/home/filebrowser/data
      - ${DATA_DIR}/documents:/srv
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.34.2
    container_name: ollama
    environment:
      # No calls to ollama.com (model recommendations, cloud cache); model pulls still work
      - OLLAMA_NO_CLOUD=true
      # Embedding and language models stay loaded together: no unload/reload between the search
      # and the answer. Two slots per model: the understanding prompt and the answer prompt each
      # keep their cached start (with one slot they evict each other); about 450 MB more.
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_KEEP_ALIVE=30m
    volumes:
      - ${DATA_DIR}/ollama:/root/.ollama
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
