# Generated by scripts/point-acces.sh from config/point-acces/hostapd.conf. @CANAL@ is filled at
# each start (least busy of 1, 6, 11).
interface=@INTERFACE@
driver=nl80211
ctrl_interface=@RUN@/hostapd
ssid=@SSID@
utf8_ssid=1
hw_mode=g
channel=@CANAL@
@PAYS_LIGNES@
ieee80211n=1
wmm_enabled=1
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=@MOT_DE_PASSE@
# Devices do not see each other: only ODIN is reachable
ap_isolate=1
