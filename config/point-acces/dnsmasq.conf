# Generated by scripts/point-acces.sh from config/point-acces/dnsmasq.conf.
# DHCP and DNS on the Wi-Fi interface only. Every name answers ODIN's address: the devices have no
# internet through ODIN anyway, and the portal (lot 2) relies on it.
interface=@INTERFACE@
# Never on the loopback (systemd-resolved stays the resolver of the machine)
except-interface=lo
bind-interfaces
no-resolv
no-hosts
pid-file=
domain=lan
dhcp-range=@DEBUT@,@FIN@,@MASQUE@,12h
# Router announced (without it Android marks the network unusable), DNS = ODIN
dhcp-option=option:router,@ADRESSE@
dhcp-option=option:dns-server,@ADRESSE@
dhcp-leasefile=@RUN@/dnsmasq.leases
host-record=@NOM@,@NOM@.lan,@ADRESSE@
address=/#/@ADRESSE@
# Windows 10 DNS probe (Microsoft Learn, NCSI: ActiveDnsProbeContent); Windows 11 and Wi-Fi use HTTP
address=/dns.msftncsi.com/131.107.255.255
# Every domain is local: a question without local data (AAAA: no IPv6 on this network) gets an
# empty answer, never REFUSED (there is no upstream server to forward it to)
local=/#/
