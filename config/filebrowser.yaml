server:
  port: 80
  baseURL: "/documents"
  database: "/home/filebrowser/data/database.db"
  # No version check against api.github.com (ODIN runs offline)
  disableUpdateCheck: true
  sources:
    - path: "/srv"
      name: "Documents"
      config:
        defaultEnabled: true

auth:
  methods:
    noauth: true
    password:
      enabled: false

frontend:
  name: "ODIN  Documents"

userDefaults:
  darkMode: true
  locale: fr
