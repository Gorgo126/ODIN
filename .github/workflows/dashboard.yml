name: Dashboard

# Builds the dashboard image of each branch, then pins that branch's compose.yml to it:
# the installer (BRANCHE=main or dev) always gets the image built from the code it cloned.
on:
  push:
    branches: [main, dev]
    paths: ['dashboard/**', '.github/workflows/dashboard.yml']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# One run at a time per branch, in push order, so the last pin wins
concurrency:
  group: dashboard-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: ./dashboard
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/gorgo126/odin-dashboard:${{ github.sha }}
            ghcr.io/gorgo126/odin-dashboard:${{ github.ref_name }}

      # Pushes made with GITHUB_TOKEN do not trigger workflows: no loop. Pinned by tag (commit) AND
      # digest of what was just pushed, like every other image of compose.yml
      - name: Pin compose.yml to this image
        env:
          EMPREINTE: ${{ steps.image.outputs.digest }}
        run: |
          case "$EMPREINTE" in sha256:[0-9a-f]*) ;; *) echo "Empreinte absente : $EMPREINTE"; exit 1 ;; esac
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
          sed -i -E "s#(image: ghcr.io/gorgo126/odin-dashboard:)[0-9a-f]{40}(@sha256:[0-9a-f]{64})?#\1$GITHUB_SHA@$EMPREINTE#" compose.yml
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Dashboard : image ${GITHUB_SHA::7}"
          git push origin "HEAD:$GITHUB_REF_NAME"
